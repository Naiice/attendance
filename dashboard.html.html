                                        })}
                                    </div>
                                    
                                    <div className="rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                                        <div className="overflow-x-auto hide-scrollbar w-full">
                                            <table className="w-full text-left text-sm min-w-[600px]">
                                                <thead className="bg-slate-50 text-slate-500 font-black text-[11px] uppercase tracking-widest border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-4 py-4 w-12 text-center">
                                                            <input 
                                                                type="checkbox" 
                                                                onChange={handleSelectAllPresent} 
                                                                checked={presentEmployees.length > 0 && Object.values(presentUpdates).filter(u => u.checked).length === presentEmployees.length}
                                                                className="w-4 h-4 rounded text-emerald-500 accent-emerald-500 cursor-pointer" 
                                                            />
                                                        </th>
                                                        <th className="px-4 py-4">{tr("รหัสพนักงาน")}</th>
                                                        <th className="px-4 py-4">{tr("ชื่อ-นามสกุล")}</th>
                                                        <th className="px-4 py-4">{tr("สายการผลิต / กลุ่ม")}</th>
                                                        <th className="px-4 py-4 text-center">{tr("สถานะเดิม")}</th>
                                                        <th className="px-4 py-4">{tr("เปลี่ยนสถานะใหม่")}</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 font-bold text-slate-600">
                                                    {presentEmployees.length > 0 ? (
                                                        presentEmployees.map((emp, idx) => {
                                                            const config = STATUS_LEGEND.find(l => emp.status.includes(l.label)) || { bg: 'bg-slate-200', color: 'text-slate-500' };
                                                            const updateData = presentUpdates[emp.id] || { checked: false, status: emp.status === 'ไม่มีข้อมูล' ? 'มาปกติ' : emp.status };
                                                            
                                                            return (
                                                                <tr key={idx} className={`transition-colors ${updateData.checked ? 'bg-emerald-50/40' : 'hover:bg-slate-50/50'}`}>
                                                                    <td className="px-4 py-4 text-center">
                                                                        <input 
                                                                            type="checkbox" 
                                                                            checked={updateData.checked} 
                                                                            onChange={() => togglePresentCheck(emp.id, emp.status)} 
                                                                            className="w-4 h-4 rounded text-emerald-500 accent-emerald-500 cursor-pointer" 
                                                                        />
                                                                    </td>
                                                                    <td className="px-4 py-4 text-[12px]">{emp.id}</td>
                                                                    <td className="px-4 py-4">{emp.name || 'ไม่ระบุ'}</td>
                                                                    <td className="px-4 py-4">
                                                                        <span className="text-blue-600 font-black bg-blue-50 px-2.5 py-1 rounded-md text-[10px] mr-2 uppercase tracking-wider">{emp.line}</span>
                                                                        <span className="text-[11px]">{emp.group}</span>
                                                                    </td>
                                                                    <td className="px-4 py-4 text-center">
                                                                        <span className={`${config.bg} text-white px-3 py-1 rounded-full text-[10px] font-black shadow-sm inline-block`}>
                                                                            {tr(emp.status)}
                                                                        </span>
                                                                    </td>
                                                                    <td className="px-4 py-4">
                                                                        <select 
                                                                            value={updateData.status} 
                                                                            onChange={(e) => changePresentStatus(emp.id, e.target.value)}
                                                                            className={`text-[12px] font-bold border rounded-lg px-2 py-1.5 outline-none cursor-pointer shadow-sm w-full max-w-[120px] transition-colors
                                                                                ${updateData.checked ? 'border-emerald-400 bg-white text-emerald-700' : 'border-slate-200 bg-slate-50 text-slate-500 hover:border-slate-300'}`}
                                                                        >
                                                                            {STATUS_LEGEND.filter(l => l.label !== 'ไม่มีข้อมูล').map(l => (
                                                                                <option key={l.label} value={l.label}>{tr(l.label)}</option>
                                                                            ))}
                                                                        </select>
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })
                                                    ) : (
                                                        <tr>
                                                            <td colSpan="6" className="px-6 py-12 text-center text-slate-400 italic font-bold">
                                                                <i className="fa-regular fa-face-frown text-2xl block mb-2 opacity-50"></i> {tr("ไม่มีพนักงานมาทำงานในข้อมูลที่เลือก")} </td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-4 border-t border-slate-100 bg-slate-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div className="text-sm font-bold text-slate-600"> {tr("เลือกเพื่ออัปเดต")} <span className="text-emerald-600 font-black bg-white px-2 py-0.5 rounded border border-emerald-100 shadow-sm mx-1">{Object.values(presentUpdates).filter(u => u.checked).length}</span> {tr("รายการ")} </div>
                                    <div className="flex flex-col sm:flex-row gap-3 items-center w-full sm:w-auto">
                                        {presentSaveStatus && (
                                            <span className={`text-[12px] font-black px-3 py-1.5 rounded-full bg-white shadow-sm border ${presentSaveStatus.type === 'success' ? 'text-emerald-600 border-emerald-100' : 'text-rose-600 border-rose-100'}`}>
                                                {presentSaveStatus.msg}
                                            </span>
                                        )}
                                        <button 
                                            onClick={handleSavePresentStatus}
                                            disabled={isSavingPresent || Object.values(presentUpdates).filter(u => u.checked).length === 0}
                                            className="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed text-white px-6 py-2.5 rounded-[1rem] font-black text-sm transition-all shadow-md flex items-center justify-center gap-2"
                                        >
                                            {isSavingPresent ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-floppy-disk"></i>} {tr("บันทึกสถานะลง Google Sheets")} </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AttendanceView = ({ employees }) => {
            const [searchId, setSearchId] = useState('');
            const [searchedEmp, setSearchedEmp] = useState(null);
            
            const payrollCycles = useMemo(() => {
                const now = new Date();
                let m = now.getMonth() + 1; 
                let y = now.getFullYear();
                const cycles = [];
                for(let i=0; i<4; i++){
                    let currentM = m - i;
                    let currentY = y;
                    if(currentM <= 0) { currentM += 12; currentY -= 1; }
                    cycles.push({ 
                        start: `${currentY}-${String(currentM).padStart(2,'0')}-21`,
                        end: `${currentM === 12 ? currentY+1 : currentY}-${String(currentM === 12 ? 1 : currentM+1).padStart(2,'0')}-20`,
                        label: `รอบ 21 ${currentM}/${currentY} - 20 ${currentM === 12 ? 1 : currentM+1}/${currentM === 12 ? currentY+1 : currentY}`
                    });
                }
                return cycles;
            }, []);

            const [selectedCycle, setSelectedCycle] = useState(() => {
                const now = new Date();
                let y = now.getFullYear();
                let m = now.getMonth() + 1;
                let d = now.getDate();
                if (d < 21) { m -= 1; if (m === 0) { m = 12; y -= 1; } }
                const startStr = `${y}-${String(m).padStart(2, '0')}-21`;
                const found = payrollCycles.find(c => c.start === startStr);
                return found ? found.start : payrollCycles[0].start;
            });

            const handleSearch = (e) => {
                if(e) e.preventDefault();
                if (!searchId.trim()) {
                    alert(tr("กรุณากรอกรหัสพนักงานก่อนค้นหา"));
                    return;
                }
                
                const cleanSearchId = String(searchId).replace(/\s/g, '');
                const emp = employees.find(e => String(e.id).replace(/\s/g, '') === cleanSearchId);
                
                if (!emp) {
                    alert(`ไม่พบข้อมูลพนักงานรหัส: ${cleanSearchId} \n\nโปรดตรวจสอบรหัสอีกครั้ง (อาจไม่มีข้อมูลในชีตปัจจุบัน)`);
                    setSearchedEmp(null);
                } else {
                    setSearchedEmp(emp);
                }
            };

            const getStats = useMemo(() => {
                if(!searchedEmp) return { normal: 0, late: 0, leave: 0, absent: 0, ot: 0, dayShiftCount: 0, nightShiftCount: 0, details: [] };
                
                const cycle = payrollCycles.find(c => c.start === selectedCycle);
                const start = new Date(cycle.start);
                const end = new Date(cycle.end);
                
                let stats = { normal: 0, late: 0, leave: 0, absent: 0, ot: 0, dayShiftCount: 0, nightShiftCount: 0, details: [] };
                
                const allDates = new Set([
                    ...Object.keys(searchedEmp.statusesByDate || {}),
                    ...Object.keys(searchedEmp.otByDate || {})
                ]);

                allDates.forEach(dateStr => {
                    const d = new Date(dateStr);
                    if(d >= start && d <= end) {
                        if (searchedEmp.resignedDate && d > new Date(searchedEmp.resignedDate)) {
                            return;
                        }
                        
                        const status = searchedEmp.statusesByDate?.[dateStr] || 'ไม่มีข้อมูล';
                        const otValue = parseFloat(searchedEmp.otByDate?.[dateStr]) || 0;
                        
                        if (status !== 'ไม่มีข้อมูล' || otValue > 0) {
                            if(status === 'มาปกติ') stats.normal++;
                            else if(status === 'สาย') stats.late++;
                            else if(status.includes('ลา')) stats.leave++;
                            else if(status === 'ขาดงาน') stats.absent++;
                            
                            const dateShift = searchedEmp.shiftsByDate?.[dateStr];
                            if (dateShift === 'Shift A') stats.dayShiftCount++;
                            else if (dateShift === 'Shift B') stats.nightShiftCount++;
                            
                            stats.ot += otValue;
                            stats.details.push({ date: dateStr, status: status, ot: otValue, shift: dateShift });
                        }
                    }
                });
                
                stats.details.sort((a,b) => new Date(b.date) - new Date(a.date));
                return stats;
            }, [searchedEmp, selectedCycle, payrollCycles]);

            const donutGradientStr = useMemo(() => {
                const totalDays = getStats.normal + getStats.late + getStats.leave + getStats.absent;
                if (totalDays === 0) return 'conic-gradient(#e2e8f0 0% 100%)';
                
                const nPct = (getStats.normal / totalDays) * 100;
                const laPct = (getStats.late / totalDays) * 100;
                const lePct = (getStats.leave / totalDays) * 100;
                const aPct = (getStats.absent / totalDays) * 100;
                
                let current = 0;
                const parts = [];
                if (nPct > 0) { parts.push(`#10b981 ${current}% ${current + nPct}%`); current += nPct; }
                if (laPct > 0) { parts.push(`#f97316 ${current}% ${current + laPct}%`); current += laPct; }
                if (lePct > 0) { parts.push(`#94a3b8 ${current}% ${current + lePct}%`); current += lePct; }
                if (aPct > 0) { parts.push(`#ef4444 ${current}% ${current + aPct}%`); current += aPct; }
                
                return `conic-gradient(${parts.join(', ')})`;
            }, [getStats]);

            return (
                <div className="w-full max-w-[1920px] mx-auto space-y-6 animate-in fade-in duration-500 pb-20">
                    <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-6 sm:p-10">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-[1.5rem] flex items-center justify-center text-3xl mx-auto mb-4 shadow-sm">
                                <i className="fa-solid fa-user-clock"></i>
                            </div>
                            <h2 className="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight">{tr("ตรวจสอบเวลาการมาทำงาน")} <br/><span className="text-slate-400 text-xl sm:text-2xl">{tr("个人考勤查询")}</span></h2>
                            <div className="mt-2 inline-block bg-slate-50 border border-slate-100 px-4 sm:px-6 py-1.5 rounded-full">
                                <p className="text-slate-400 text-[11px] sm:text-[13px] font-bold">{tr("รอบตัดเงินเดือน วันที่ 21 ถึง วันที่ 20 ของเดือนถัดไป")}</p>
                            </div>
                        </div>

                        <form onSubmit={handleSearch} className="flex flex-col sm:flex-row gap-3 max-w-xl mx-auto mb-10 w-full">
                            <div className="relative flex-1 group">
                                <div className="absolute inset-y-0 left-5 flex items-center pointer-events-none text-slate-300 group-focus-within:text-blue-500 transition-colors">
                                    <i className="fa-regular fa-id-card text-xl"></i>
                                </div>
                                <input 
                                    type="text" value={searchId} onChange={(e)=>setSearchId(e.target.value)}
                                    placeholder={tr("ใส่รหัสพนักงาน...")} 
                                    className="w-full bg-slate-50 border border-slate-100 rounded-[1.2rem] pl-14 pr-5 py-4 font-black text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:bg-white transition-all text-lg"
                                />
                            </div>
                            <button type="submit" className="w-full sm:w-auto bg-blue-600 text-white px-10 py-4 rounded-[1.2rem] font-black hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all active:scale-95 flex items-center justify-center gap-2">
                                <i className="fa-solid fa-magnifying-glass"></i> {tr("ค้นหา")} </button>
                        </form>

                        {searchedEmp ? (
                            <div className="space-y-6 animate-in slide-in-from-bottom-4 duration-500">
                                <div className="bg-white rounded-[2rem] border border-slate-100 p-6 sm:p-8 flex flex-col md:flex-row items-center gap-6 sm:gap-8 shadow-[0_10px_30px_-5px_rgba(0,0,0,0.03)]">
                                    <div className="relative w-24 h-24 sm:w-28 sm:h-28 flex-shrink-0 mx-auto md:mx-0">
                                        <div className="w-full h-full rounded-full shadow-inner" style={{ background: donutGradientStr }}></div>
                                        <div className="absolute inset-0 m-auto w-[70px] h-[70px] sm:w-[85px] sm:h-[85px] bg-slate-50 rounded-full flex items-center justify-center border-[3px] border-white shadow-sm text-blue-500 text-2xl sm:text-3xl">
                                            <i className="fa-solid fa-person text-blue-400"></i>
                                        </div>
                                    </div>
                                    <div className="flex-1 text-center md:text-left">
                                        <h3 className="text-[28px] sm:text-[34px] font-black text-slate-800 leading-none mb-4">{searchedEmp.name}</h3>
                                        <div className="flex flex-wrap justify-center md:justify-start gap-2.5">
                                            <span className="bg-slate-50 border border-slate-100 px-4 py-1.5 rounded-full text-[11px] font-black text-slate-400 flex items-center gap-2">
                                                <i className="fa-solid fa-hashtag text-[10px] opacity-60"></i> {searchedEmp.id}
                                            </span>
                                            <span className="bg-slate-50 border border-slate-100 px-4 py-1.5 rounded-full text-[11px] font-black text-slate-400 flex items-center gap-2">
                                                <i className="fa-solid fa-location-dot text-[10px] opacity-60"></i> {searchedEmp.line} - {searchedEmp.group}
                                            </span>
                                            <span className="bg-slate-50 border border-slate-100 px-4 py-1.5 rounded-full text-[11px] font-black text-slate-400 flex items-center gap-2">
                                                <i className="fa-solid fa-user-tie text-[10px] opacity-60"></i> {searchedEmp.role || 'Manager'}
                                            </span>
                                            {searchedEmp.resignedDate && (
                                                <span className="bg-red-50 border border-red-100 px-4 py-1.5 rounded-full text-[11px] font-black text-red-500 flex items-center gap-2">
                                                    <i className="fa-solid fa-user-xmark text-[10px]"></i> {tr("ลาออกเมื่อ")} {new Date(searchedEmp.resignedDate).toLocaleDateString(window.HaierI18n.locale(), { day: 'numeric', month: 'short', year: 'numeric' })}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                    <div className="w-full md:w-auto mt-4 md:mt-0">
                                        <div className="bg-slate-50/50 p-2 rounded-2xl border border-slate-100">
                                            <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest ml-3 mb-1">{tr("เลือกรอบเงินเดือน")}</label>
                                            <select 
                                                value={selectedCycle} 
                                                onChange={(e)=>setSelectedCycle(e.target.value)}
                                                className="bg-white border-none text-[13px] font-black text-blue-600 outline-none pr-8 py-2.5 pl-3 rounded-xl cursor-pointer w-full shadow-sm"
                                            >
                                                {payrollCycles.map(c => <option key={c.start} value={c.start}>{tr(c.label)}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                    <div className="bg-white border border-slate-100 p-4 sm:p-6 rounded-[2rem] text-center shadow-sm">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">{tr("มาทำงานปกติ")} <span className="font-bold block text-emerald-400">{tr("正常")}</span></p>
                                        <p className="text-3xl sm:text-4xl font-black text-emerald-500 leading-none mb-1">{getStats.normal}<span className="text-xl sm:text-3xl opacity-50">/{getStats.details.length}</span> <span className="text-xs text-slate-400">{tr("วัน")}</span></p>
                                    </div>
                                    <div className="bg-white border border-slate-100 p-4 sm:p-6 rounded-[2rem] text-center shadow-sm">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">{tr("มาสาย")} <span className="font-bold block text-orange-400">{tr("迟到")}</span></p>
                                        <p className="text-3xl sm:text-4xl font-black text-orange-500 leading-none mb-1">{getStats.late} <span className="text-xs text-slate-400">{tr("วัน")}</span></p>
                                    </div>
                                    <div className="bg-white border border-slate-100 p-4 sm:p-6 rounded-[2rem] text-center shadow-sm">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">{tr("ลาหยุด/ลากิจ/ลาป่วย")} <span className="font-bold block text-slate-400">{tr("请假")}</span></p>
                                        <p className="text-3xl sm:text-4xl font-black text-slate-300 leading-none mb-1">{getStats.leave} <span className="text-xs text-slate-400">{tr("วัน")}</span></p>
                                    </div>
                                    <div className="bg-white border border-slate-100 p-4 sm:p-6 rounded-[2rem] text-center shadow-sm">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">{tr("ขาดงาน")} <span className="font-bold block text-red-400">{tr("旷工")}</span></p>
                                        <p className="text-3xl sm:text-4xl font-black text-red-500 leading-none mb-1">{getStats.absent} <span className="text-xs text-slate-400">{tr("วัน")}</span></p>
                                    </div>
                                    <div className="col-span-2 md:col-span-1 bg-white border border-slate-100 p-4 sm:p-6 rounded-[2rem] text-center shadow-sm bg-blue-50/20 border-blue-100">
                                        <p className="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-2 italic">{tr("ชั่วโมงโอทีรวม")} <span className="font-bold block text-blue-400">{tr("加班")}</span></p>
                                        <p className="text-3xl sm:text-4xl font-black text-blue-600 leading-none mb-1">{getStats.ot.toFixed(1)} <span className="text-xs text-slate-400">{tr("ชม.")}</span></p>
                                    </div>
                                </div>

                                <div className="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden shadow-sm">
                                    <div className="bg-slate-50/50 px-6 sm:px-10 py-5 flex flex-col md:flex-row items-start md:items-center justify-between border-b border-slate-100 gap-4">
                                        <div>
                                            <h4 className="text-lg font-black text-slate-800">{tr("รายละเอียดการลงเวลาและโอที")}</h4>
                                            <div className="flex flex-wrap gap-2 sm:gap-3 mt-2">
                                                <span className="text-[11px] font-black text-slate-50 bg-white px-3 py-1 rounded-full border shadow-sm flex items-center gap-1.5">
                                                    <i className="fa-solid fa-sun text-orange-500"></i> {tr("ทำกะเช้า")} {getStats.dayShiftCount} {tr("วัน")} </span>
                                                <span className="text-[11px] font-black text-slate-500 bg-white px-3 py-1 rounded-full border shadow-sm flex items-center gap-1.5">
                                                    <i className="fa-solid fa-moon text-indigo-500"></i> {tr("ทำกะดึก")} {getStats.nightShiftCount} {tr("วัน")} </span>
                                            </div>
                                        </div>
                                        <span className="text-[11px] font-bold text-slate-400 bg-white px-4 py-1.5 rounded-full border">{tr("ทั้งหมด")} {getStats.details.length} {tr("วันที่มีข้อมูล")}</span>
                                    </div>
                                    <div className="max-h-[500px] overflow-x-auto overflow-y-auto custom-scrollbar">
                                        <table className="w-full text-left border-collapse min-w-[500px]">
                                            <thead className="bg-white sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    <th className="px-6 sm:px-10 py-4 text-[10px] font-black text-slate-300 uppercase tracking-widest border-b">{tr("วันที่ (DATE)")}</th>
                                                    <th className="px-6 sm:px-10 py-4 text-[10px] font-black text-slate-300 uppercase tracking-widest border-b text-center">{tr("สถานะ (STATUS)")}</th>
                                                    <th className="px-6 sm:px-10 py-4 text-[10px] font-black text-slate-300 uppercase tracking-widest border-b text-center">{tr("กะ (SHIFT)")}</th>
                                                    <th className="px-6 sm:px-10 py-4 text-[10px] font-black text-slate-300 uppercase tracking-widest border-b text-right">{tr("โอที (OT)")}</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {getStats.details.map((d, i) => {
                                                    const config = STATUS_LEGEND.find(l => d.status.includes(l.label));
                                                    const bgClass = config ? config.bg : 'bg-slate-200';
                                                    const textClass = config ? 'text-white' : 'text-slate-500';
                                                    
                                                    let shiftDisplay = '-';
                                                    let shiftColor = 'text-slate-400';
                                                    if (d.shift === 'Shift A') { shiftDisplay = 'DAY'; shiftColor = 'text-orange-500 font-black'; }
                                                    else if (d.shift === 'Shift B') { shiftDisplay = 'NIGHT'; shiftColor = 'text-indigo-500 font-black'; }

                                                    return (
                                                        <tr key={i} className="hover:bg-slate-50/50 transition-colors group">
                                                            <td className="px-6 sm:px-10 py-4 sm:py-5 text-[12px] sm:text-sm font-bold text-slate-600 border-b border-slate-50">
                                                                {new Date(d.date).toLocaleDateString(window.HaierI18n.locale(), { day: 'numeric', month: 'long', year: 'numeric' })}
                                                            </td>
                                                            <td className="px-6 sm:px-10 py-4 sm:py-5 border-b border-slate-50 text-center">
                                                                <span className={`inline-block px-3 sm:px-4 py-1.5 rounded-full text-[10px] sm:text-[11px] font-black ${bgClass} ${textClass} shadow-sm`}>
                                                                    {tr(d.status)}
                                                                </span>
                                                            </td>
                                                            <td className="px-6 sm:px-10 py-4 sm:py-5 border-b border-slate-50 text-center">
                                                                <span className={`text-[11px] sm:text-[12px] ${shiftColor}`}>
                                                                    {shiftDisplay}
                                                                </span>
                                                            </td>
                                                            <td className="px-6 sm:px-10 py-4 sm:py-5 text-right font-black text-slate-300 border-b border-slate-50 group-hover:text-blue-500">
                                                                {d.ot > 0 ? <span className="text-[#ea580c] text-base sm:text-lg">{d.ot}</span> : '-'}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {getStats.details.length === 0 && (
                                                    <tr>
                                                        <td colSpan="4" className="px-10 py-20 text-center text-slate-300 italic font-bold">{tr("ไม่พบข้อมูลการลงเวลาในรอบนี้")}</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-20 opacity-30 italic">
                                <i className="fa-solid fa-magnifying-glass text-6xl mb-6 block text-slate-200"></i>
                                <p className="font-bold text-slate-400">{tr("กรุณากรอกรหัสพนักงานเพื่อค้นหาข้อมูล")}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const LeaveStatsView = ({ employees, selectedLine, activeShift }) => {
            const STATUS_COLORS = {
                'มาปกติ': { text: 'text-emerald-500', bg: 'bg-emerald-100' },
                'สาย': { text: 'text-orange-500', bg: 'bg-orange-100' },
                'ลาป่วย': { text: 'text-slate-600', bg: 'bg-slate-200' },
                'ลากิจ': { text: 'text-fuchsia-600', bg: 'bg-fuchsia-100' },
                'ลาพักร้อน': { text: 'text-purple-600', bg: 'bg-purple-100' },
                'ลาอื่นๆ': { text: 'text-blue-600', bg: 'bg-blue-100' },
                'ขาดงาน': { text: 'text-rose-600', bg: 'bg-rose-100' },
                'ไม่มีข้อมูล': { text: 'text-slate-400', bg: 'bg-slate-50' }
            };

            const isLeave = (status) => ['ลาป่วย', 'ลากิจ', 'ลาพักร้อน', 'ลาอื่นๆ', 'ขาดงาน'].includes(status);
            
            const getShortStatus = (status) => {
                if(status.includes('ป่วย')) return 'ป่วย';
                if(status.includes('กิจ')) return 'กิจ';
                if(status.includes('พักร้อน')) return 'พักร้อน';
                if(status.includes('อื่น')) return 'อื่นๆ';
                if(status.includes('ขาด')) return 'ขาด';
                return '-';
            };

            const availableDates = useMemo(() => {
                if (!employees.length || !employees[0].statusesByDate) return [];
                return Object.keys(employees[0].statusesByDate).sort((a, b) => new Date(b) - new Date(a));
            }, [employees]);

            const [endDate, setEndDate] = useState('');
            useEffect(() => {
                if (availableDates.length > 0 && !endDate) {
                    setEndDate(availableDates[0]);
                }
            }, [availableDates]);

            const weekDates = useMemo(() => {
                if (!endDate || availableDates.length === 0) return [];
                const idx = availableDates.indexOf(endDate);
                if (idx === -1) return availableDates.slice(0, 7).reverse();
                return availableDates.slice(idx, idx + 7).reverse();
            }, [endDate, availableDates]);

            const lineStats = useMemo(() => {
                return [1, 2, 3, 4, 5, 6, 11].map(l => {
                    let count = 0;
                    employees.forEach(emp => {
                        if (emp.isResignedFromNote || (emp.resignedDate && new Date(weekDates[0]) > new Date(emp.resignedDate))) return;
                        if (emp.shift !== activeShift) return;
                        
                        const regex = new RegExp(`(^|\\s|\\W)${l}(\\s|\\W|$)`);
                        if (!regex.test((emp.line || '').toString().toUpperCase())) return;

                        weekDates.forEach(date => {
                            if (isLeave(emp.statusesByDate?.[date])) count++;
                        });
                    });
                    return { line: `LINE ${l}`, count };
                });
            }, [employees, activeShift, weekDates]);

            const dailyStats = useMemo(() => {
                return weekDates.map(date => {
                    let count = 0;
                    employees.forEach(emp => {
                        if (emp.isResignedFromNote || (emp.resignedDate && new Date(date) > new Date(emp.resignedDate))) return;
                        if (emp.shift !== activeShift) return;
                        
                        if (selectedLine !== 'ALL') {
                            const lineNum = selectedLine.replace('LINE ', '').trim();
                            const regex = new RegExp(`(^|\\s|\\W)${lineNum}(\\s|\\W|$)`);
                            if (!regex.test((emp.line || '').toString().toUpperCase())) return;
                        }
                        if (isLeave(emp.statusesByDate?.[date])) count++;
                    });
                    return { date, displayDate: new Date(date).toLocaleDateString(window.HaierI18n.locale(), {day:'numeric', month:'short'}), count };
                });
            }, [employees, activeShift, selectedLine, weekDates]);

            const maxLeaveDay = dailyStats.reduce((max, p) => p.count > max.count ? p : max, dailyStats[0] || {count: 0});

            const tableData = useMemo(() => {
                return employees.filter(emp => {
                    if (emp.isResignedFromNote || (emp.resignedDate && new Date(weekDates[weekDates.length-1]) > new Date(emp.resignedDate))) return false;
                    if (emp.shift !== activeShift) return false;
                    
                    if (selectedLine !== 'ALL') {
                        const lineNum = selectedLine.replace('LINE ', '').trim();
                        const regex = new RegExp(`(^|\\s|\\W)${lineNum}(\\s|\\W|$)`);
                        if (!regex.test((emp.line || '').toString().toUpperCase())) return false;
                    }

                    let hasLeave = false;
                    weekDates.forEach(date => { if (isLeave(emp.statusesByDate?.[date])) hasLeave = true; });
                    return hasLeave;
                }).map(emp => {
                    let totalLeave = 0;
                    weekDates.forEach(date => { if (isLeave(emp.statusesByDate?.[date])) totalLeave++; });
                    return { ...emp, totalLeave };
                }).sort((a,b) => b.totalLeave - a.totalLeave);
            }, [employees, activeShift, selectedLine, weekDates]);

            const getDirectImageUrl = (url) => {
                if (!url) return null;
                const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (driveMatch && driveMatch[1]) {
                    return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w100`;
                }
                return url;
            };

            const maxLineCount = Math.max(...lineStats.map(d => d.count), 1);
            const maxDailyCount = Math.max(...dailyStats.map(d => d.count), 1);

            return (
                <div className="w-full max-w-[1920px] mx-auto space-y-6 animate-in fade-in duration-500 pb-20">
                    <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-6 sm:p-8">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-100 pb-6">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-rose-100">
                                    <i className="fa-solid fa-calendar-minus"></i>
                                </div>
                                <div>
                                    <h2 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2"> {tr("สถิติการลา (รายสัปดาห์)")} </h2>
                                    <p className="text-[12px] font-bold text-slate-500 mt-1"> {tr("ข้อมูล 7 วัน อ้างอิงเฉพาะ")} <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md mx-1">{tr(activeShift)}</span> {tr("และ")} <span className="text-orange-600 bg-orange-50 px-2 py-0.5 rounded-md mx-1">{tr(selectedLine)}</span>
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border border-slate-200 w-full sm:w-auto">
                                <span className="text-[11px] font-black text-slate-400 pl-3 uppercase tracking-wider whitespace-nowrap">{tr("สิ้นสุดวันที่:")}</span>
                                <select 
                                    value={endDate} 
                                    onChange={(e) => setEndDate(e.target.value)}
                                    className="bg-white border border-slate-200 text-[13px] font-black text-blue-600 outline-none pr-8 py-2 pl-3 rounded-xl cursor-pointer shadow-sm w-full"
                                >
                                    {availableDates.map(date => (
                                        <option key={date} value={date}>
                                            {new Date(date).toLocaleDateString(window.HaierI18n.locale(), { day: 'numeric', month: 'short', year: 'numeric' })}
                                        </option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                            <div className="bg-slate-50/50 rounded-2xl border border-slate-200 p-6 flex flex-col">
                                <h3 className="text-[13px] font-black text-slate-700 uppercase tracking-widest mb-6 flex items-center gap-2">
                                    <i className="fa-solid fa-chart-column text-indigo-400"></i> {tr("เปรียบเทียบยอดลารวมแต่ละไลน์")} </h3>
                                <div className="flex-1 flex items-end justify-around gap-2 mt-4 pb-2 relative h-[180px]">
                                    <div className="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-20 pb-8">
                                        {[...Array(4)].map((_,i) => <div key={i} className="border-t border-dashed border-slate-400 w-full h-0"></div>)}
                                    </div>
                                    
                                    {lineStats.map((d, i) => {
                                        const hPct = (d.count / maxLineCount) * 100;
                                        const isSelectedLine = selectedLine === 'ALL' || selectedLine === d.line;
                                        return (
                                            <div key={i} className={`flex flex-col items-center gap-2 relative z-10 w-full group ${isSelectedLine ? '' : 'opacity-40 grayscale'}`}>
                                                <div className="text-[10px] font-black text-slate-600 mb-1 opacity-0 group-hover:opacity-100 transition-opacity bg-white px-2 py-0.5 rounded shadow-sm border border-slate-200 absolute -top-6">
                                                    {d.count} {tr("ครั้ง")} </div>
                                                <div className="w-full max-w-[40px] h-36 bg-slate-200/50 rounded-lg relative overflow-hidden flex items-end border border-slate-200 shadow-inner">
                                                    <div className="w-full transition-all duration-1000 rounded-lg bg-gradient-to-t from-indigo-500 to-indigo-300" style={{ height: `${hPct}%` }}></div>
                                                </div>
                                                <span className="text-[10px] font-black text-slate-500">{d.line.replace('LINE ', 'L')}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="bg-slate-50/50 rounded-2xl border border-slate-200 p-6 flex flex-col">
                                <h3 className="text-[13px] font-black text-slate-700 uppercase tracking-widest mb-6 flex items-center gap-2">
                                    <i className="fa-solid fa-chart-line text-rose-400"></i> {tr("แนวโน้มยอดลารายวัน (")}{tr(selectedLine)})
                                </h3>
                                <div className="flex-1 flex items-end justify-around gap-1 mt-4 pb-2 relative h-[180px]">
                                    <div className="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-20 pb-8">
                                        {[...Array(4)].map((_,i) => <div key={i} className="border-t border-dashed border-slate-400 w-full h-0"></div>)}
                                    </div>

                                    {dailyStats.map((d, i) => {
                                        const hPct = (d.count / maxDailyCount) * 100;
                                        const isMax = d.count === maxDailyCount && d.count > 0;
                                        return (
                                            <div key={i} className="flex flex-col items-center gap-2 relative z-10 w-full group">
                                                <div className="text-[10px] font-black text-slate-600 mb-1 opacity-0 group-hover:opacity-100 transition-opacity bg-white px-2 py-0.5 rounded shadow-sm border border-slate-200 absolute -top-6 whitespace-nowrap">
                                                    {d.count} {tr("คน")} </div>
                                                <div className="w-full max-w-[32px] h-36 bg-slate-200/50 rounded-lg relative overflow-hidden flex items-end border border-slate-200 shadow-inner">
                                                    <div className={`w-full transition-all duration-1000 rounded-lg bg-gradient-to-t ${isMax ? 'from-rose-500 to-rose-300 shadow-[0_-5px_15px_rgba(244,63,94,0.3)]' : 'from-slate-400 to-slate-300'}`} style={{ height: `${hPct}%` }}></div>
                                                </div>
                                                <span className={`text-[9px] font-black ${isMax ? 'text-rose-500' : 'text-slate-500'}`}>{d.displayDate}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                                {maxLeaveDay.count > 0 && (
                                    <p className="text-[11px] font-bold text-center mt-3 text-slate-500"> {tr("วันที่คนลามากที่สุดคือ")} <span className="text-rose-600 font-black">{maxLeaveDay.displayDate}</span> {tr("(ลารวม")} {maxLeaveDay.count} {tr("คน)")} </p>
                                )}
                            </div>
                        </div>

                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-2">
                            <h3 className="text-[14px] font-black text-slate-800 uppercase tracking-widest flex items-center gap-2">
                                <i className="fa-solid fa-list-ul text-slate-400"></i> {tr("รายชื่อพนักงานที่ลา (ในรอบสัปดาห์)")} </h3>
                            <span className="bg-rose-100 text-rose-600 px-3 py-1 rounded-lg text-[11px] font-black shadow-sm">{tr("พบ")} {tableData.length} {tr("รายการ")}</span>
                        </div>
                        
                        <div className="rounded-2xl border border-slate-200 overflow-hidden shadow-sm bg-white">
                            <div className="overflow-x-auto hide-scrollbar custom-scrollbar w-full">
                                <table className="w-full text-left text-sm min-w-[800px]">
                                    <thead className="bg-slate-50 text-slate-500 font-black text-[11px] uppercase tracking-widest border-b border-slate-200 sticky top-0 z-10">
                                        <tr>
                                            <th className="px-4 py-4 w-16 text-center">{tr("รูป")}</th>
                                            <th className="px-4 py-4">{tr("รหัส")}</th>
                                            <th className="px-4 py-4">{tr("ชื่อ-นามสกุล")}</th>
                                            <th className="px-4 py-4 text-center">{tr("ไลน์")}</th>
                                            <th className="px-4 py-4">{tr("ตำแหน่ง")}</th>
                                            <th className="px-4 py-4 text-center">{tr("สังกัด")}</th>
                                            {weekDates.map(d => (
                                                <th key={d} className="px-2 py-4 text-center border-l border-slate-200">
                                                    <div className="flex flex-col items-center leading-tight">
                                                        <span>{new Date(d).toLocaleDateString(window.HaierI18n.locale(), {day:'numeric'})}</span>
                                                        <span className="text-[8px] opacity-60">{new Date(d).toLocaleDateString('en-US', {weekday:'short'})}</span>
                                                    </div>
                                                </th>
                                            ))}
                                            <th className="px-4 py-4 text-center border-l border-slate-200">{tr("รวม (วัน)")}</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 font-bold text-slate-600">
                                        {tableData.length > 0 ? (
                                            tableData.map((emp, idx) => {
                                                const directPicUrl = getDirectImageUrl(emp.picture);
                                                return (
                                                    <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                        <td className="px-4 py-2 flex justify-center">
                                                            {directPicUrl ? (
                                                                <img src={directPicUrl} alt={emp.name} className="w-8 h-8 rounded-full object-cover border border-slate-200 shadow-sm" onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2NiZDVlMSI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAy 12IDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zczEuMzQtMyAzLTN6bTAgMTQuMmMtMi41IDAtNC43MS0xLjI4LTYtMy4yMi4wMy0xLjk5IDQtMy4wOCA2LTMuMDhzNS45NyAxLjA5IDYgMy4wOGMtMS4yOSAxLjk0LTMuNSAzLjIyLTYgMy4yMnoiLz48L3N2Zz4='; }} />
                                                            ) : (
                                                                <div className="w-8 h-8 rounded-full border border-slate-200 shadow-sm bg-slate-100 flex items-center justify-center"><i className="fa-solid fa-user text-slate-300 text-xs"></i></div>
                                                            )}
                                                        </td>
                                                        <td className="px-4 py-3 text-[11px] font-black">{emp.id}</td>
                                                        <td className="px-4 py-3 text-[12px]">{emp.name}</td>
                                                        <td className="px-4 py-3 text-center">
                                                            <span className="text-slate-600 font-black bg-slate-100 px-2 py-0.5 rounded text-[10px]">{emp.line}</span>
                                                        </td>
                                                        <td className="px-4 py-3 text-[11px] text-slate-400 truncate max-w-[120px]" title={emp.role}>{emp.role || emp.group || '-'}</td>
                                                        <td className="px-4 py-3 text-center">
                                                            <span className="text-slate-500 font-bold bg-white border border-slate-200 px-2 py-0.5 rounded text-[9px] shadow-sm">{emp.contract || '-'}</span>
                                                        </td>
                                                        
                                                        {weekDates.map(d => {
                                                            const status = emp.statusesByDate?.[d] || 'ไม่มีข้อมูล';
                                                            const isL = isLeave(status);
                                                            const sColor = STATUS_COLORS[status] || STATUS_COLORS['ไม่มีข้อมูล'];
                                                            
                                                            return (
                                                                <td key={d} className="px-1 py-3 text-center border-l border-slate-50">
                                                                    {isL ? (
                                                                        <span className={`inline-flex items-center justify-center w-full max-w-[40px] px-1 py-1 rounded-md text-[9px] font-black shadow-sm border border-white ${sColor.bg} ${sColor.text}`} title={status}>
                                                                            {getShortStatus(status)}
                                                                        </span>
                                                                    ) : (
                                                                        <span className="text-slate-300 text-[10px]">-</span>
                                                                    )}
                                                                </td>
                                                            );
                                                        })}
                                                        <td className="px-4 py-3 text-center border-l border-slate-100">
                                                            <span className="text-rose-600 font-black bg-rose-50 border border-rose-100 px-2.5 py-1 rounded-lg text-[11px] shadow-sm">{emp.totalLeave}</span>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        ) : (
                                            <tr>
                                                <td colSpan={7 + weekDates.length} className="px-6 py-16 text-center text-slate-400 italic font-bold">
                                                    <i className="fa-regular fa-face-smile text-3xl block mb-3 opacity-30 text-emerald-500"></i> {tr("ไม่มีพนักงานลาหรือขาดงานในสัปดาห์นี้")} </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const KeyPositionsView = ({ employees, selectedLine, activeShift }) => {
            const [searchTerm, setSearchTerm] = useState('');
            
            const KEY_ROLES = [
                { id: 'supervisor', label: 'Supervisor', zh: '主管', sub: 'ซุปเปอร์ไวเซอร์', keywords: ['supervisor', 'ซุปเปอร์', 'sup'], color: 'bg-rose-500', text: 'text-rose-600', light: 'bg-rose-50', icon: 'fa-shield-halved' },
                { id: 'leader', label: 'Leader', zh: '组长', sub: 'หัวหน้างาน', keywords: ['leader', 'หัวหน้า', 'lead'], color: 'bg-cyan-500', text: 'text-cyan-600', light: 'bg-cyan-50', icon: 'fa-medal' },
                { id: 'welding', label: 'Welding', zh: '焊接', sub: 'งานเชื่อม', keywords: ['welding', 'weld', 'เชื่อม'], color: 'bg-orange-500', text: 'text-orange-600', light: 'bg-orange-50', icon: 'fa-fire' },
                { id: 'vacuum', label: 'Vacuum / Charging', zh: '抽真空 / 充注', sub: 'แวคคั่ม/เติมสาร', keywords: ['vacuum', 'vac', 'แวคคัม', 'แวคคั่ม', 'แวค', 'charging', 'charge', 'เติมสาร', 'ชาร์จ'], color: 'bg-blue-500', text: 'text-blue-600', light: 'bg-blue-50', icon: 'fa-gauge-high' },
                { id: 'pinch', label: 'Pinch-off', zh: '封口', sub: 'ปิดระบบ/บีบ', keywords: ['pinch', 'พินช์', 'พิน', 'ปิดระบบ', 'ปิดผนึก', 'บีบ'], color: 'bg-indigo-500', text: 'text-indigo-600', light: 'bg-indigo-50', icon: 'fa-snowflake' },
                { id: 'cooling', label: 'Cooling / Test', zh: '测试', sub: 'ทดสอบ', keywords: ['cooling', 'cool', 'ทดสอบ', 'test', 'เทส'], color: 'bg-purple-500', text: 'text-purple-600', light: 'bg-purple-50', icon: 'fa-flask-vial' },
                { id: 'screw', label: 'Screw', zh: '打螺丝', sub: 'ขันสกรู', keywords: ['screw', 'สกรู', 'ขัน'], color: 'bg-emerald-500', text: 'text-emerald-600', light: 'bg-emerald-50', icon: 'fa-screwdriver' }
            ];

            const getDirectImageUrl = (url) => {
                if (!url) return null;
                const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (driveMatch && driveMatch[1]) {
                    return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w100`;
                }
                return url;
            };

            const { processedList, counts, total } = useMemo(() => {
                const uniqueEmpsMap = new Map();
                const roleCounts = { supervisor: 0, leader: 0, welding: 0, vacuum: 0, pinch: 0, cooling: 0, screw: 0 };

                employees.forEach(emp => {
                    if (emp.isResignedFromNote || (emp.resignedDate && new Date() > new Date(emp.resignedDate))) return;
                    if (emp.shift !== activeShift) return;

                    const lineNum = selectedLine.replace('LINE ', '').trim();
                    if (selectedLine !== 'ALL') {
                        const regex = new RegExp(`(^|\\s|\\W)${lineNum}(\\s|\\W|$)`);
                        if (!regex.test((emp.line || '').toString().toUpperCase())) return;
                    }

                    if (searchTerm) {
                        const term = searchTerm.toLowerCase().trim();
                        const idMatch = String(emp.id).toLowerCase().includes(term);
                        const nameMatch = String(emp.name).toLowerCase().includes(term);
                        if (!idMatch && !nameMatch) return;
                    }

                    const mainRoleStr = [emp.role, emp.group].join(' ').toLowerCase();
                    const fullRoleStr = [emp.role, emp.role2, emp.role3, emp.role4, emp.group].join(' ').toLowerCase();
                    
                    let primaryCat = null;
                    let matchedCats = [];

                    for (const cat of KEY_ROLES) {
                        if (cat.keywords.some(kw => mainRoleStr.includes(kw.toLowerCase()))) {
                            primaryCat = cat;
                            break;
                        }
                    }

                    for (const cat of KEY_ROLES) {
                        if (cat.keywords.some(kw => fullRoleStr.includes(kw.toLowerCase()))) {
                            matchedCats.push(cat);
                        }
                    }

                    if (!primaryCat && matchedCats.length > 0) {
                        primaryCat = matchedCats[0];
                    }

                    if (primaryCat && matchedCats.length > 0) {
                        roleCounts[primaryCat.id]++;
                        uniqueEmpsMap.set(emp.id, { ...emp, category: primaryCat, allCategories: matchedCats });
                    }
                });

                const list = Array.from(uniqueEmpsMap.values());
                list.sort((a, b) => {
                    if (a.line === b.line) return a.category.id.localeCompare(b.category.id);
                    return a.line.localeCompare(b.line);
                });

                return { processedList: list, counts: roleCounts, total: list.length };
            }, [employees, activeShift, selectedLine, searchTerm]);

            const handleExportCSV = () => {
                const headers = ['รหัส', 'ชื่อ-นามสกุล', 'ไลน์', 'กลุ่ม', 'ตำแหน่งหลัก', 'ตำแหน่งเสริม 1 (Role2)', 'ตำแหน่งเสริม 2 (Role3)', 'ตำแหน่งเสริม 3 (Role4)', 'สังกัด', 'ทักษะสำคัญที่ระบบตรวจพบ'];
                const rows = processedList.map(e => [
                    `"${e.id}"`, 
                    `"${e.name}"`, 
                    `"${e.line}"`, 
                    `"${e.group}"`, 
                    `"${e.role}"`, 
                    `"${e.role2 || ''}"`, 
                    `"${e.role3 || ''}"`, 
                    `"${e.role4 || ''}"`, 
                    `"${e.contract}"`,
                    `"${e.allCategories?.map(c => c.label).join(', ') || ''}"`
                ]);
                const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + 
                    [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `haier_key_positions_${activeShift}_${selectedLine}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="w-full max-w-[1920px] mx-auto space-y-6 animate-in fade-in duration-500 pb-20">
                    <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-6 sm:p-8">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-4">
                            <div className="flex items-center gap-4 shrink-0">
                                <div className="w-12 h-12 bg-amber-100 text-amber-500 rounded-2xl flex items-center justify-center text-2xl shadow-sm">
                                    <i className="fa-solid fa-star"></i>
                                </div>
                                <div>
                                    <h2 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2"> {tr("ตำแหน่งสำคัญ")} <span className="text-slate-400 text-lg">{tr("关键岗位")}</span>
                                    </h2>
                                    <p className="text-[12px] font-bold text-slate-500 mt-1"> {tr("ข้อมูลอ้างอิงเฉพาะ")} <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md mx-1">{tr(activeShift)}</span> {tr("และ")} <span className="text-orange-600 bg-orange-50 px-2 py-0.5 rounded-md mx-1">{tr(selectedLine)}</span>
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 bg-slate-50 p-2.5 rounded-2xl border border-slate-200 px-4 shadow-inner w-full lg:flex-1 lg:max-w-md xl:max-w-lg">
                                <i className="fa-solid fa-search text-slate-400"></i>
                                <input 
                                    type="text" placeholder={tr("ค้นหารหัส หรือ ชื่อพนักงาน...")} 
                                    value={searchTerm} onChange={e => setSearchTerm(e.target.value)} 
                                    className="bg-transparent border-none text-[13px] font-bold outline-none text-slate-800 w-full" 
                                />
                            </div>

                            <div className="flex flex-wrap items-center gap-3 shrink-0">
                                <div className="bg-slate-50 px-5 py-2.5 rounded-full border border-slate-200 shadow-sm flex items-center gap-3">
                                    <span className="text-slate-500 font-bold text-sm">{tr("พนักงานสำคัญทั้งหมด")}</span>
                                    <span className="text-xl font-black text-slate-800">{total} <span className="text-sm font-bold text-slate-400">{tr("คน")}</span></span>
                                </div>
                                <button onClick={handleExportCSV} className="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2.5 rounded-full font-black text-[13px] shadow-sm transition-colors flex items-center gap-2">
                                    <i className="fa-solid fa-file-csv"></i> {tr("Export CSV")} </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 flex flex-col h-auto lg:h-[600px]">
                                <h3 className="text-[14px] font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2">
                                    <i className="fa-solid fa-list-ul text-slate-400"></i> {tr("รายชื่อพนักงาน (Employees List)")} </h3>
                                <div className="rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex-1 flex flex-col bg-white">
                                    <div className="overflow-y-auto custom-scrollbar flex-1 w-full overflow-x-auto">
                                        <table className="w-full text-left text-sm min-w-[700px]">
                                            <thead className="bg-slate-50 text-slate-500 font-black text-[11px] uppercase tracking-widest border-b border-slate-200 sticky top-0 z-10">
                                                <tr>
                                                    <th className="px-4 sm:px-5 py-4 w-20 text-center">{tr("รหัส (ID)")}</th>
                                                    <th className="px-4 sm:px-5 py-4">{tr("ชื่อ-นามสกุล (Name)")}</th>
                                                    <th className="px-4 sm:px-5 py-4 w-24 text-center">{tr("ไลน์ (Line)")}</th>
                                                    <th className="px-4 sm:px-5 py-4">{tr("ตำแหน่งหลัก (Role)")}</th>
                                                    <th className="px-4 sm:px-5 py-4">{tr("ตำแหน่งเสริม 1 (Role 2)")}</th>
                                                    <th className="px-4 sm:px-5 py-4">{tr("ตำแหน่งเสริม 2 (Role 3)")}</th>

                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-bold text-slate-600">
                                                {processedList.length > 0 ? (
                                                    processedList.map((emp, idx) => {
                                                        const directPicUrl = getDirectImageUrl(emp.picture);
                                                        
                                                        return (
                                                        <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                            <td className="px-4 sm:px-5 py-3 text-[12px] text-center">{emp.id}</td>
                                                            <td className="px-4 sm:px-5 py-3">{emp.name || '-'}</td>
                                                            <td className="px-4 sm:px-5 py-3 text-center">
                                                                <span className="text-slate-600 font-black bg-slate-100 px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wider">{emp.line}</span>
                                                            </td>
                                                            <td className="px-4 sm:px-5 py-3">
                                                                <div className="flex flex-col items-start gap-1">
                                                                    <span className={`px-2.5 py-0.5 rounded text-[10px] font-black ${emp.category.light} ${emp.category.text} border shadow-sm border-white flex items-center gap-1.5`}>
                                                                        <i className={`fa-solid ${emp.category.icon}`}></i> {tr(emp.category.label)}

                                                            </td>
                                                            <td className="px-4 sm:px-5 py-3">

                                                            </td>
                                                            <td className="px-4 sm:px-5 py-3">
                                                                {emp.role4 ? <span className="bg-blue-50 text-blue-600 border border-blue-100 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">{emp.role4}</span> : <span className="text-slate-300 text-[10px]">-</span>}
                                                            </td>
                                                            <td className="px-4 sm:px-5 py-3 text-center">
                                                                <span className="text-slate-500 font-bold bg-white border border-slate-200 px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wider shadow-sm">{emp.contract || '-'}</span>
                                                            </td>
                                                            <td className="px-4 sm:px-5 py-2 flex justify-center">
                                                                <div className="relative group cursor-pointer hover:z-[100]">
                                                                    {directPicUrl ? (

                                                                            <img 
                                                                                src={directPicUrl} alt={emp.name} 
                                                                                className="w-full h-full object-cover"
                                                                                onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }} 
                                                                            />
                                                                            <i className="fa-solid fa-user text-slate-300 text-lg hidden absolute"></i>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="w-10 h-10 rounded-full border border-slate-200 shadow-sm bg-slate-50 flex items-center justify-center z-10">
                                                                            <i className="fa-solid fa-user text-slate-200 text-lg"></i>
                                                                        </div>
                                                                    )}
                                                                    {directPicUrl && (
                                                                        <div className="absolute top-1/2 -translate-y-1/2 -right-[6px] w-0 h-0 border-t-[8px] border-t-transparent border-b-[8px] border-b-transparent border-l-[8px] border-l-[#0f172a]"></div>
                                                                    )}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    )})
                                                ) : (
                                                    <tr>
                                                        <td colSpan="9" className="px-6 py-20 text-center text-slate-400 italic font-bold"> {tr("ไม่พบพนักงานในตำแหน่งสำคัญสำหรับเงื่อนไขที่เลือก")} </td>
                                                    </tr>
                                                )}
                                            </tbody>
