        @import url('https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Hide Scrollbar for Nav */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Factory Map Styles */
        .conveyor-belt {
            background: #1e293b;
            height: 35px;
            position: relative;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px);
            border-top: 2px solid #334155;
            border-bottom: 2px solid #0f172a;
        }
        
        .map-card {
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        @keyframes pulse-emerald {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }
        .status-dot { animation: pulse-emerald 2s infinite; }
        
        /* Animation for Conveyor Belt */
        @keyframes belt-bg-slide {
            0% { background-position: 0 0, 10px 10px; }
            100% { background-position: 40px 0, 50px 10px; }
        }
        .conveyor-bg-animate {
            animation: belt-bg-slide 1.5s linear infinite;
        }
        @keyframes items-slide-right {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }
        .animate-conveyor-items {
            width: 200%;
            animation: items-slide-right 12s linear infinite;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
        
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* Print Styles (Export PDF) */
        @media print {
            body { background-color: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .print-hidden { display: none !important; }
            .glass-nav, footer { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; background: white !important; }
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl { box-shadow: none !important; }
            .map-card, .bg-white { border: 1px solid #e2e8f0 !important; }
            @page { size: landscape; margin: 10mm; }
        }

        /* Ambient digital globe: decorative layer behind all application content. */
        body { background: #edf4fb; }
        #digital-background { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
            background: radial-gradient(ellipse at 90% 35%, #dbeafe 0%, transparent 60%), linear-gradient(135deg, #f8fafc, #edf5fb); }
        #digital-background::after { content: ''; position: absolute; inset: 0; opacity: .25;
            background-image: linear-gradient(#93b5d322 1px, transparent 1px), linear-gradient(90deg, #93b5d322 1px, transparent 1px); background-size: 56px 56px; }
        #digital-globe { width: 100%; height: 100%; display: block; }
        #root { position: relative; z-index: 1; }
        #root > div > main { background: transparent; }
        @media print { #digital-background { display: none !important; } }

        /* Clean production workspace theme */
        :root { --suite-ink: #14283f; --suite-blue: #2563eb; --suite-line: #e2e9f1; }
        body { color: var(--suite-ink); }
        #digital-globe { opacity: .65; }
        #digital-background::after { opacity: .12; }
        #root .suite-nav { display: grid; grid-template-columns: auto minmax(0,1fr); height: auto;
            padding: 0; gap: 0; background: #12263e; border: 0; box-shadow: 0 4px 20px #14283f0d; }
        .suite-brand { padding: 18px 28px; }
        .suite-brand > div:first-child { background: #2c6bed; box-shadow: none; border-radius: 12px; }
        .suite-brand h1 { color: #fff; font-size: 17px; font-style: normal; letter-spacing: -.3px; font-weight: 700; }
        .suite-brand p { color: #a7bdd4; font-size: 9px; letter-spacing: 1.6px; margin-top: 7px; }
        #root .suite-tabs { order: initial; width: 100%; min-width: 0; justify-content: flex-end; gap: 4px; padding: 12px 24px 12px 8px; }
        .suite-tabs button { color: #bed0e2; border: 1px solid transparent; background: transparent; border-radius: 9px; box-shadow: none; min-height: 40px; }
        .suite-tabs button:hover { background: #ffffff0d; color: white; }
        .suite-tabs button[aria-current="page"] { background: #2563eb; color: #fff; border-color: #5185f0; box-shadow: 0 3px 10px #00000012; }
        #root .suite-filters { grid-column: 1 / -1; width: 100%; min-width: 0; margin: 0;
            padding: 12px 28px; background: #ffffffed; border: 0; border-bottom: 1px solid var(--suite-line); gap: 16px; }
        .suite-filters > div { border: 0; background: #f0f4f8; border-radius: 10px; padding: 4px; }
        .suite-filters button { min-height: 34px; font-size: 11px; color: #526780; border-radius: 7px; font-weight: 700; }
        .suite-filters button[aria-pressed="true"] { background: #fff; color: #1d4ed8; box-shadow: 0 1px 5px #14283f18; }
        .suite-filters > button:last-child { margin-left: auto; }
        #root button:focus-visible, #root input:focus-visible, #root select:focus-visible {
            outline: 3px solid #60a5fa; outline-offset: 3px; }
        #root > div > main > .w-full { max-width: 1800px; }
        #dashboard-capture-area { border-radius: 20px; border-color: var(--suite-line); box-shadow: 0 8px 32px #1e3a5f06; }
        #dashboard-capture-area h2 { font-style: normal; font-weight: 700; letter-spacing: -.6px; }
        #dashboard-capture-area > hr { border-color: var(--suite-line); }
        #dashboard-capture-area > div:first-of-type + div button { transition: background-color .15s, box-shadow .15s; }
        #root .suite-kpi { position: relative; border-radius: 14px; padding: 15px 20px; border-color: #e1e9f2;
            background: linear-gradient(145deg,#fff,#f8fafd); box-shadow: 0 3px 10px #14283f04; gap: 14px; }
        .suite-kpi > i { background: #edf4ff; padding: 11px; border-radius: 11px; font-size: 18px; }
        .suite-kpi > div > p:first-child { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: #14283f; }
        .suite-kpi > div > p:last-child { font-size: 10px; font-weight: 500; color: #62758c; margin-top: 7px; }
        #root .suite-kpi:last-child { background: #eef7f5; border-color: #cfe7e0; }
        .suite-kpi:last-child > i { background: #dff1eb; }
        .map-card { border-radius: 16px; box-shadow: 0 4px 16px #14283f08; }
        #root main > div > .bg-white { border-radius: 20px; border-color: var(--suite-line); }
        #root main table thead { background: #f3f6fa; }
        #root main table th { color: #526780; }
        #root > div > footer { background: #ffffff80; border-color: var(--suite-line); padding: 18px 20px; }
        #root > div > footer > div { color: #70839a; font-style: normal; letter-spacing: 1px; font-weight: 500; }
        @media (max-width: 1199px) {
            #root .suite-nav { grid-template-columns: minmax(0,1fr); }
            .suite-brand { padding: 16px 20px 6px; }
            #root .suite-tabs { justify-content: flex-start; padding: 10px 20px 14px; }
            #root .suite-filters { padding: 10px 20px; }
        }
        @media (max-width: 639px) {
            #root .suite-nav { position: relative; }
            #root .suite-tabs { padding-left: 16px; padding-right: 16px; }
            #root .suite-filters { gap: 10px; padding: 10px 16px; }
            .suite-filters button { min-height: 36px; }
            #root .suite-kpi { padding: 14px 10px; gap: 9px; }
            .suite-kpi > div > p:first-child { font-size: 24px; }
            #dashboard-capture-area { border-radius: 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #root *, #root *::before, #root *::after { animation: none !important; transition: none !important; }
        }
        @media print {
            #root .suite-nav { display: none !important; }
            #root .suite-kpi { background: white; box-shadow: none; }
        }

        /* Haier brothers: self-contained decorative mascot. */
        .haier-companion { position: fixed; right: 18px; bottom: 16px; z-index: 30; width: 118px;
            font-family: 'Sarabun', sans-serif; pointer-events: none; }
        .haier-companion figure { margin: 0; position: relative; padding: 8px 4px 0; }
        .haier-companion img { display: block; width: 110px; height: auto; transform-origin: 50% 95%;
            filter: drop-shadow(0 5px 5px #14283f18); animation: haier-greeting 5s ease-in-out infinite; }
        .haier-companion .mascot-shadow { height: 7px; width: 76px; margin: 0 auto 7px; border-radius: 50%;
            background: #173c6520; filter: blur(2px); animation: haier-shadow 5s ease-in-out infinite; }
        .haier-companion .mascot-controls { pointer-events: auto; display: flex; justify-content: center; gap: 5px; }
        .haier-companion button { cursor: pointer; border: 1px solid #dce6f0; background: #fffffff2; color: #3b5571;
            border-radius: 9px; min-width: 34px; min-height: 32px; padding: 4px 9px; font: 600 11px 'Sarabun',sans-serif;
            box-shadow: 0 2px 7px #14283f0a; }
        .haier-companion button:hover { background: #edf4ff; color: #1d4ed8; }
        .haier-companion button:focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
        .haier-companion [hidden] { display: none !important; }
        .haier-companion.paused img, .haier-companion.paused .mascot-shadow { animation-play-state: paused; }
        .haier-companion.collapsed { width: auto; }
        @keyframes haier-greeting {
            0%, 100% { transform: translateY(0) rotate(0); }
            24% { transform: translateY(-7px) rotate(-3deg); }
            48% { transform: translateY(0) rotate(0); }
            72% { transform: translateY(-5px) rotate(3deg); }
        }
        @keyframes haier-shadow { 0%,48%,100% { transform: scaleX(1); opacity: .6; } 24%,72% { transform: scaleX(.82); opacity: .35; } }
        @media (max-width: 639px) {
            .haier-companion { right: 10px; bottom: 10px; width: 88px; }
            .haier-companion img { width: 80px; }
            .haier-companion button { min-width: 38px; min-height: 38px; }
            .haier-companion .mascot-shadow { width: 54px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .haier-companion img, .haier-companion .mascot-shadow { animation: none; }
        }
        @media print { .haier-companion { display: none !important; } }
    
        #root .suite-nav { grid-template-columns: auto minmax(0,1fr) auto; }
        #root .suite-tabs { grid-column: 2; grid-row: 1; }
        #root .suite-filters { grid-column: 1 / -1; }
        .suite-language { grid-column: 3; grid-row: 1; display: flex; align-items: center; gap: 3px; padding: 10px 16px 10px 0; }
        .suite-language button { color: #c7d8ea; border: 1px solid #ffffff20; background: transparent; border-radius: 7px;

        html[lang="my"] body { font-family: 'Noto Sans Myanmar','Myanmar Text',Sarabun,sans-serif; line-height: 1.8; }

            .suite-language { grid-column: 1 / -1; grid-row: 2; padding: 8px 16px; }

        }

        const SummaryDashboard = ({ filteredEmps: baseFilteredEmps, employees, rawDate, availableDates, activeShift, STATUS_LEGEND }) => {
            const [dashLine, setDashLine] = useState('ALL');
            
            const filteredEmps = useMemo(() => {
                if (dashLine === 'ALL') return baseFilteredEmps;
                const lineNum = dashLine.replace('LINE ', '').trim();
                const regex = new RegExp(`(^|\\s|\\W)${lineNum}(\\s|\\W|$)`);
                return baseFilteredEmps.filter(e => regex.test((e.line || '').toString().toUpperCase()));
            }, [baseFilteredEmps, dashLine]);

            const totalEmps = filteredEmps.length;
            
            const getHexColor = (bgClass) => {
                const match = bgClass.match(/#([0-9a-fA-F]{6})/);
                return match ? match[0] : '#cbd5e1';
            };
            
            let currentGradientPercent = 0;
            const pieData = STATUS_LEGEND.map(legend => {
                const count = filteredEmps.filter(e => (e.status || 'ไม่มีข้อมูล').includes(legend.label)).length;
                const percent = totalEmps > 0 ? (count / totalEmps) * 100 : 0;
                const hexColor = getHexColor(legend.bg);
                const gradientString = `${hexColor} ${currentGradientPercent}% ${currentGradientPercent + percent}%`;
                currentGradientPercent += percent;
                return { ...legend, count, percent, hexColor, gradientString };
            }).filter(d => d.count > 0);

            const conicGradientStr = `conic-gradient(${pieData.map(d => d.gradientString).join(', ')})`;
            
            const sortedPie = [...pieData].sort((a,b) => b.count - a.count);
            const topPie = sortedPie.length > 0 ? sortedPie[0] : null;
            const secondPie = sortedPie.length > 1 ? sortedPie[1] : null;

            const ORIGINAL_LINES = [1, 2, 3, 4, 5, 6, 7, 8, 11];
            
            const barData = ORIGINAL_LINES.map(lineNum => {
                const regex = new RegExp(`(^|\\s|\\W)${lineNum}(\\s|\\W|$)`);
                const lineEmps = baseFilteredEmps.filter(e => regex.test((e.line || '').toString().toUpperCase()));
                const total = lineEmps.length;
                const present = lineEmps.filter(e => e.status === 'มาปกติ' || e.status === 'สาย').length;
                const percent = total > 0 ? (present/total)*100 : 0;
                return { name: `Line ${lineNum}`, total, present, percent };

            const validBars = barData.filter(b => b.total > 0);
            const sortedBars = [...validBars].sort((a,b) => b.percent - a.percent);

            const bottomBar = sortedBars.length > 0 ? sortedBars[sortedBars.length - 1] : null;

            const sortedDates = Array.from(availableDates).sort((a,b) => new Date(a) - new Date(b));
            const currentIdx = sortedDates.indexOf(rawDate);
            const trendDates = currentIdx !== -1 
                ? sortedDates.slice(Math.max(0, currentIdx - 6), currentIdx + 1)
                : sortedDates.slice(-7);
            
            const lineNumFilter = dashLine.replace('LINE ', '').trim();
            const lineRegex = new RegExp(`(^|\\s|\\W)${lineNumFilter}(\\s|\\W|$)`);
            
            const trendData = trendDates.map(date => {
                const dayEmps = employees.filter(e => {
                    if (e.isResignedFromNote) return false;
                    if (e.resignedDate && new Date(date) > new Date(e.resignedDate)) return false;
                    if (e.shift !== activeShift) return false;
                    if (dashLine !== 'ALL' && !lineRegex.test((e.line || '').toString().toUpperCase())) return false;
                    return true;
                });
                const pres = dayEmps.filter(e => {
                    const s = e.statusesByDate?.[date] || 'ไม่มีข้อมูล';
                    return s === 'มาปกติ' || s === 'สาย'; 
                }).length;

                const resigns = employees.filter(e => {
                    if (e.shift !== activeShift) return false;
                    if (dashLine !== 'ALL' && !lineRegex.test((e.line || '').toString().toUpperCase())) return false;
                    return e.statusesByDate?.[date] === 'ลาออก' || e.resignedDate === date;
                }).length;

                const tot = dayEmps.length;
                const rate = tot > 0 ? (pres/tot)*100 : 0;
                const displayDate = new Date(date).toLocaleDateString(window.HaierI18n.locale(), { day: 'numeric', month: 'short' });
                return { date, displayDate, rate, present: pres, total: tot, resigns };
            });

            const maxRate = 100;
            const minRate = Math.max(0, Math.min(...trendData.map(d => d.rate)) - 10);
            const getX = (index) => (index / (Math.max(1, trendData.length - 1))) * 180;
            const getY = (val) => 100 - ((val - minRate) / (maxRate - minRate || 1)) * 100;
            const polylinePoints = trendData.map((d, i) => `${getX(i)},${getY(d.rate)}`).join(' ');
            const areaPoints = trendData.length > 0 ? `0,100 ${polylinePoints} 180,100` : '';

            const maxResign = Math.max(5, ...trendData.map(d => d.resigns));
            const getResignY = (val) => 100 - (val / maxResign) * 80;
            const resignPolylinePoints = trendData.map((d, i) => `${getX(i)},${getResignY(d.resigns)}`).join(' ');

            const latestRate = validTrendData.length > 0 ? validTrendData[validTrendData.length - 1].rate : 0;

                                    {barData.map((d, i) => (

                                </p>

                        </div>

                        <div className="bg-white border border-slate-100 p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-300 flex flex-col justify-between h-full">
                            <div className="w-full flex-1 flex flex-col">
                                <h3 className="text-[14px] font-black text-slate-800 uppercase tracking-widest mb-1 w-full text-left flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center shadow-sm"><i className="fa-solid fa-user-xmark text-sm"></i></div> {tr("แนวโน้มคนลาออก")} </h3>
                                <p className="text-[11px] font-bold text-slate-400 mb-6 tracking-wide ml-11">{tr("จำนวน (คน) อ้างอิงเฉพาะกะ")} <span className="font-black text-rose-500 bg-rose-50 px-2 py-0.5 rounded-md ml-1">{tr(activeShift)}</span> {tr("ไลน์")} <span className="font-black text-blue-500 bg-blue-50 px-2 py-0.5 rounded-md ml-1">{tr(dashLine)}</span></p>
                                
                                <div className="flex-1 w-full relative mt-4 h-[180px]">

                                                <stop offset="100%" stopColor="#f43f5e" stopOpacity="0.0"/>
                                            </linearGradient>
                                        </defs>
                                        <line x1="0" y1="0" x2="180" y2="0" stroke="#cbd5e1" strokeDasharray="3" strokeWidth="0.5" />
                                        <line x1="0" y1="50" x2="180" y2="50" stroke="#cbd5e1" strokeDasharray="3" strokeWidth="0.5" />

                                        <polyline fill="none" stroke="#f43f5e" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" points={resignPolylinePoints} style={{ filter: 'drop-shadow(0px 4px 6px rgba(244, 63, 94, 0.2))' }} />
                                        
                                        {trendData.map((d, i) => (

                                                <rect x={getX(i)-14} y={getResignY(d.resigns)-22} width="28" height="14" rx="4" fill="#0f172a" className="opacity-0 group-hover:opacity-100 transition-opacity shadow-lg" />
                                                <text x={getX(i)} y={getResignY(d.resigns) - 12} fontSize="5.5" textAnchor="middle" fill="#0f172a" className="opacity-100 group-hover:fill-white transition-colors" fontWeight="900">{d.resigns}</text>

                            <div className="w-full mt-8 bg-rose-50/50 rounded-2xl p-5 border border-rose-100/50 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-20 h-20 bg-rose-500 opacity-5 rounded-bl-[100%] pointer-events-none"></div>
                                <h4 className="text-[12px] font-black text-rose-800 uppercase flex items-center gap-1.5 mb-2.5">
                                    <i className="fa-solid fa-user-minus text-amber-500"></i> {tr("สรุปข้อมูลลาออก")} </h4>

                                    {resignTrendText}
                                </p>

                    </div>
                </div>
            );
        };

        const Rba60View = ({ employees, selectedLine, activeShift }) => {
            const [selectedRangeId, setSelectedRangeId] = useState('');
            const [searchTerm, setSearchTerm] = useState('');

            const availableRanges = useMemo(() => {
                if (!employees.length || !employees[0].statusesByDate) return [];
                const allDates = Object.keys(employees[0].statusesByDate).sort((a, b) => new Date(b) - new Date(a));

                const formatDateStr = (date) => {
                    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                };

                const weeksMap = new Map();

                allDates.forEach(dateStr => {
                    const d = new Date(dateStr);
                    const day = d.getDay();
                    const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
                    const monday = new Date(d);
                    monday.setDate(diffToMonday);

                    const sunday = new Date(monday);
                    sunday.setDate(monday.getDate() + 6);

                    const mondayStr = formatDateStr(monday);
                    const sundayStr = formatDateStr(sunday);
                    const weekKey = `${mondayStr}|${sundayStr}`;

                    if (!weeksMap.has(weekKey)) {
                        weeksMap.set(weekKey, {
                            id: weekKey,
                            startDate: mondayStr,
                            endDate: sundayStr,
                            dates: []
                        });
                    }
                    weeksMap.get(weekKey).dates.push(dateStr);
                });

                const ranges = Array.from(weeksMap.values()).sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
                ranges.forEach(range => {
                    range.dates.sort((a, b) => new Date(a) - new Date(b));
                });

                return ranges;
            }, [employees]);

            useEffect(() => {
                if (availableRanges.length > 0 && !selectedRangeId) {
                    setSelectedRangeId(availableRanges[0].id);
                }
            }, [availableRanges]);

            const currentRange = useMemo(() => {
                return availableRanges.find(r => r.id === selectedRangeId) || availableRanges[0];
            }, [selectedRangeId, availableRanges]);

            const weekDates = useMemo(() => {
                return currentRange ? currentRange.dates : [];
            }, [currentRange]);

            const tableData = useMemo(() => {
                let list = employees.filter(emp => {
                    if (emp.isResignedFromNote || (emp.resignedDate && weekDates.length > 0 && new Date(weekDates[weekDates.length-1]) > new Date(emp.resignedDate))) return false;
                    if (emp.shift !== activeShift) return false;
                    
                    if (selectedLine !== 'ALL') {
                        const lineNum = selectedLine.replace('LINE ', '').trim();
                        const regex = new RegExp(`(^|\\s|\\W)${lineNum}(\\s|\\W|$)`);
                        if (!regex.test((emp.line || '').toString().toUpperCase())) return false;
                    }

                    if (searchTerm) {
                        const term = searchTerm.toLowerCase().trim();
                        const idMatch = String(emp.id).toLowerCase().includes(term);
                        const nameMatch = String(emp.name).toLowerCase().includes(term);
                        if (!idMatch && !nameMatch) return false;
                    }

                    return true;
                });

                return list.map(emp => {
                    let presentDays = 0;
                    let totalOT = 0;
                    weekDates.forEach(date => {
                        const status = emp.statusesByDate?.[date] || 'ไม่มีข้อมูล';
                        if (status === 'มาปกติ' || status === 'สาย') {
                            presentDays += 1;
                        }
                        const ot = parseFloat(emp.otByDate?.[date]) || 0;
                        totalOT += ot;
                    });
                    const normalHours = presentDays * 8;
                    const totalHours = normalHours + totalOT;
                    
                    return { ...emp, presentDays, normalHours, totalOT, totalHours };
                }).sort((a,b) => {
                    if (a.line === b.line) return b.totalHours - a.totalHours;
                    return a.line.localeCompare(b.line);
                });
            }, [employees, activeShift, selectedLine, weekDates, searchTerm]);

            const groupedData = useMemo(() => {
                const groups = {};
                tableData.forEach(emp => {
                    const line = emp.line || 'ไม่ระบุ Line';
                    if (!groups[line]) groups[line] = [];
                    groups[line].push(emp);
                });
                return groups;
            }, [tableData]);

            const getDirectImageUrl = (url) => {
                if (!url) return null;
                const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (driveMatch && driveMatch[1]) {
                    return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w100`;
                }
                return url;
            };

            const handleExportCSV = () => {
                const headers = ['รหัส', 'ชื่อ-นามสกุล', 'ไลน์', 'ตำแหน่ง', 'กลุ่ม', 'เวลาปกติ (ชม.)', 'โอที (ชม.)', 'รวมเวลาทำงาน (ชม.)'];
                const rows = tableData.map(e => [
                    `"${e.id}"`, 
                    `"${e.name}"`, 
                    `"${e.line}"`, 
                    `"${e.role}"`, 
                    `"${e.group}"`, 
                    `"${e.normalHours}"`, 
                    `"${e.totalOT.toFixed(1)}"`, 
                    `"${e.totalHours.toFixed(1)}"`
                ]);
                const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + 
                    [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `haier_rba60_${activeShift}_${selectedLine}_${selectedRangeId.replace('|', '_to_')}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="w-full max-w-[1920px] mx-auto space-y-6 animate-in fade-in duration-500 pb-20">
                    <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-6 sm:p-8">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-4">
                            <div className="flex items-center gap-4 shrink-0">
                                <div className="w-12 h-12 bg-red-100 text-red-500 rounded-2xl flex items-center justify-center text-2xl shadow-sm">
                                    <i className="fa-solid fa-business-time"></i>
                                </div>
                                <div>
                                    <h2 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                                        RBA 60 <span className="text-slate-400 text-lg">{tr("工时管控")}</span>
                                    </h2>
                                    <p className="text-[12px] font-bold text-slate-500 mt-1"> {tr("ติดตามชั่วโมงการทำงาน (7 วัน) อ้างอิงเฉพาะ")} <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md mx-1">{tr(activeShift)}</span> {tr("และ")} <span className="text-orange-600 bg-orange-50 px-2 py-0.5 rounded-md mx-1">{tr(selectedLine)}</span>
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 bg-slate-50 p-2.5 rounded-2xl border border-slate-200 px-4 shadow-inner w-full lg:flex-1 lg:max-w-md">
                                <i className="fa-solid fa-search text-slate-400"></i>
                                <input 
                                    type="text" placeholder={tr("ค้นหารหัส หรือ ชื่อพนักงาน...")} 
                                    value={searchTerm} onChange={e => setSearchTerm(e.target.value)} 
                                    className="bg-transparent border-none text-[13px] font-bold outline-none text-slate-800 w-full" 
                                />
                            </div>

                            <div className="flex flex-wrap items-center gap-3 shrink-0">
                                <div className="flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border border-slate-200">
                                    <span className="text-[11px] font-black text-slate-400 pl-3 uppercase tracking-wider whitespace-nowrap">{tr("ช่วงวันที่:")}</span>
                                    <select 
                                        value={selectedRangeId} 
                                        onChange={(e) => setSelectedRangeId(e.target.value)}
                                        className="bg-white border border-slate-200 text-[13px] font-black text-blue-600 outline-none pr-8 py-2 pl-3 rounded-xl cursor-pointer shadow-sm min-w-[180px]"
                                    >
                                        {availableRanges.map(range => {
                                            const startStr = new Date(range.startDate).toLocaleDateString(window.HaierI18n.locale(), { day: 'numeric', month: 'short' });
                                            const endStr = new Date(range.endDate).toLocaleDateString(window.HaierI18n.locale(), { day: 'numeric', month: 'short', year: 'numeric' });
                                            return (
                                                <option key={range.id} value={range.id}>
                                                    {startStr} - {endStr}
                                                </option>
                                            );
                                        })}
                                    </select>
                                </div>
                                <button onClick={handleExportCSV} className="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2.5 rounded-full font-black text-[13px] shadow-sm transition-colors flex items-center gap-2">
                                    <i className="fa-solid fa-file-csv"></i> {tr("Export CSV")} </button>
                            </div>
                        </div>

                        <div className="space-y-8">
                            {Object.keys(groupedData).length > 0 ? (
                                Object.keys(groupedData).map(line => (
                                    <div key={line} className="rounded-[2rem] border border-slate-200 overflow-hidden shadow-sm bg-white">
                                        <div className="bg-slate-50 border-b border-slate-200 p-4">
                                            <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">
                                                <i className="fa-solid fa-grip-lines text-slate-400"></i> {line}
                                                <span className="bg-blue-100 text-blue-600 text-[11px] px-2 py-1 rounded-lg ml-2">{groupedData[line].length} {tr("คน")}</span>
                                            </h3>
                                        </div>
                                        <div className="overflow-x-auto hide-scrollbar custom-scrollbar w-full">
                                            <table className="w-full text-left text-sm min-w-[800px]">
                                                <thead className="bg-slate-50/50 text-slate-500 font-black text-[11px] uppercase tracking-widest border-b border-slate-200 sticky top-0 z-10">
                                                    <tr>
                                                        <th className="px-4 py-4 w-16 text-center">{tr("รูป")}</th>
                                                        <th className="px-4 py-4">{tr("รหัส")}</th>
                                                        <th className="px-4 py-4">{tr("ชื่อ-นามสกุล")}</th>
                                                        <th className="px-4 py-4">{tr("ตำแหน่ง/กลุ่ม")}</th>
                                                        <th className="px-4 py-4 text-center">{tr("เวลาปกติ (ชม.)")}</th>
                                                        <th className="px-4 py-4 text-center">{tr("โอที (ชม.)")}</th>
                                                        <th className="px-4 py-4 text-center">{tr("รวมเวลาทำงาน")}</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 font-bold text-slate-600">
                                                    {groupedData[line].map((emp, idx) => {
                                                        const directPicUrl = getDirectImageUrl(emp.picture);
                                                        const isOver = emp.totalHours > 55;
                                                        return (
                                                            <tr key={idx} className={`transition-colors ${isOver ? 'bg-red-50 hover:bg-red-100' : 'hover:bg-slate-50'}`}>
                                                                <td className="px-4 py-2 flex justify-center">
                                                                    {directPicUrl ? (
                                                                        <img src={directPicUrl} className="w-8 h-8 rounded-full object-cover border border-slate-200 shadow-sm" onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2NiZDVlMSI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAy 12IDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zczEuMzQtMyAzLTN6bTAgMTQuMmMtMi41IDAtNC43MS0xLjI4LTYtMy4yMi4wMy0xLjk5IDQtMy4wOCA2LTMuMDhzNS45NyAxLjA5IDYgMy4wOGMtMS4yOSAxLjk0LTMuNSAzLjIyLTYgMy4yMnoiLz48L3N2Zz4='; }} />
                                                                    ) : (
                                                                        <div className="w-8 h-8 rounded-full border border-slate-200 shadow-sm bg-slate-100 flex items-center justify-center"><i className="fa-solid fa-user text-slate-300 text-xs"></i></div>
                                                                    )}
                                                                </td>
                                                                <td className="px-4 py-3 text-[11px] font-black">{emp.id}</td>
                                                                <td className="px-4 py-3 text-[12px]">{emp.name}</td>
                                                                <td className="px-4 py-3">
                                                                    <div className="flex flex-col">
                                                                        <span className="text-[10px] text-slate-400">{emp.group}</span>
                                                                        <span className="text-[11px]">{emp.role || '-'}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <span className="text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md text-[11px] shadow-sm border border-slate-200">{emp.normalHours}</span>
                                                                </td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <span className="text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md text-[11px] shadow-sm border border-blue-100">{emp.totalOT.toFixed(1)}</span>
                                                                </td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <span className={`px-3 py-1.5 rounded-lg text-[12px] font-black shadow-sm flex items-center justify-center w-fit mx-auto gap-2 ${isOver ? 'bg-red-500 text-white shadow-red-200' : 'bg-emerald-100 text-emerald-700'}`}>
                                                                        {emp.totalHours.toFixed(1)} {tr("ชม.")} {isOver && <i className="fa-solid fa-triangle-exclamation text-white animate-pulse" title={tr("เกิน 55 ชั่วโมง")}></i>}
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        )
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

        const DashboardView = ({ employees, selectedLine, activeShift, isSyncing, onRefresh }) => {
            const [rawDate, setRawDate] = useState(() => {

            const [searchTerm, setSearchTerm] = useState('');
            const [showAbsentModal, setShowAbsentModal] = useState(false);

            const [absentSaveStatus, setAbsentSaveStatus] = useState(null);

            const [presentUpdates, setPresentUpdates] = useState({});
            const [isSavingPresent, setIsSavingPresent] = useState(false);
            const [presentSaveStatus, setPresentSaveStatus] = useState(null);

            const [isCapturing, setIsCapturing] = useState(false);

            const handleShareWeChat = async () => {
                const element = document.getElementById('dashboard-capture-area');

                if (!element) return;
                
                setIsCapturing(true);
                if (actionBtns) actionBtns.style.opacity = '0'; 
                
                try {
                    const canvas = await window.html2canvas(element, { 
                        scale: 2, 
                        backgroundColor: '#ffffff',
                        useCORS: true
                    });
                    
                    if (actionBtns) actionBtns.style.opacity = '1'; 
                    
                    canvas.toBlob(async (blob) => {
                        try {
                            const item = new ClipboardItem({ 'image/png': blob });
                            await navigator.clipboard.write([item]);
                            alert('✅ แคปเจอร์หน้าจอสำเร็จ!\n\nระบบได้คัดลอกรูปภาพลง "คลิปบอร์ด" แล้ว\nคุณสามารถไปที่หน้าต่างแชทกลุ่ม WeChat แล้วกด "วาง" (Ctrl+V) หรือกดค้างเพื่อส่งรูปได้ทันทีครับ');
                        } catch (err) {
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.download = `Haier_A01_Dashboard_${selectedLine.replace(' ', '_')}.png`;

                            link.click();

            useEffect(() => {

                if (availableDates.size > 0 && !availableDates.has(rawDate)) {
                    const sortedDates = Array.from(availableDates).sort((a, b) => new Date(b) - new Date(a));

            const dynamicEmployees = useMemo(() => {

                    ...e,

                })).filter(e => {
                    if (e.isResignedFromNote) return false;
                    if (e.resignedDate && new Date(rawDate) > new Date(e.resignedDate)) return false;
                    if (e.shift !== activeShift) return false;
                    return true;
                });
            }, [employees, rawDate, activeShift]);

            const lineNum = selectedLine.replace('LINE ', '').trim();
            const filtered = dynamicEmployees.filter(e => {
                if (selectedLine !== 'ALL') {
                    const empLine = (e.line || '').toString().toUpperCase();
                    const regex = new RegExp(`(^|\\s|\\W)${lineNum}(\\s|\\W|$)`);
                    if (!regex.test(empLine)) return false;
                }
                if (searchTerm) {
                    const term = searchTerm.toLowerCase().trim();
                    const idMatch = String(e.id).toLowerCase().includes(term);
                    const nameMatch = String(e.name).toLowerCase().includes(term);
                    if (!idMatch && !nameMatch) return false;
                }
                return true;

            const stats = {
                total: filtered.length,
                came: filtered.filter(e => e.status === 'มาปกติ' || e.status === 'สาย').length,
                normal: filtered.filter(e => e.status === 'มาปกติ').length,
                rate: filtered.length > 0 ? ((filtered.filter(e => e.status === 'มาปกติ' || e.status === 'สาย').length / filtered.length) * 100).toFixed(1) : 0
            };

            const absentCount = filtered.filter(e => ['ขาดงาน', 'ลาป่วย', 'ลากิจ', 'ลาพักร้อน', 'ลาอื่นๆ'].includes(e.status)).length;
            const absentRate = stats.total > 0 ? (absentCount / stats.total) * 100 : 0;
            const isAnomaly = absentRate >= 10;

            const nonPresentEmployees = filtered.filter(e => !['มาปกติ', 'สาย'].includes(e.status));
            
            const absenceSummary = nonPresentEmployees.reduce((acc, curr) => {
                acc[curr.status] = (acc[curr.status] || 0) + 1;
                return acc;
            }, {});

            const presentEmployees = filtered.filter(e => ['มาปกติ', 'สาย'].includes(e.status));
            
            const presenceSummary = presentEmployees.reduce((acc, curr) => {
                acc[curr.status] = (acc[curr.status] || 0) + 1;
                return acc;
            }, {});

            const last7Dates = useMemo(() => {
                const sortedDates = Array.from(availableDates).sort((a,b) => new Date(a) - new Date(b));
                const currentIdx = sortedDates.indexOf(rawDate);
                return currentIdx !== -1 
                    ? sortedDates.slice(Math.max(0, currentIdx - 6), currentIdx + 1)
                    : sortedDates.slice(-7);
            }, [availableDates, rawDate]);

            const warningEmployees = useMemo(() => {
                return filtered.filter(emp => {
                    let absent7DayCount = 0;
                    last7Dates.forEach(d => {

                        if (['ขาดงาน', 'ลาป่วย', 'ลากิจ', 'ลาพักร้อน', 'ลาอื่นๆ'].includes(status)) {
                            absent7DayCount++;
                        }
                    });
                    return absent7DayCount > 3;
                }).map(emp => {
                    let absent7DayCount = 0;
                    last7Dates.forEach(d => {
                        const status = emp.statusesByDate?.[d] || 'ไม่มีข้อมูล';
                        if (['ขาดงาน', 'ลาป่วย', 'ลากิจ', 'ลาพักร้อน', 'ลาอื่นๆ'].includes(status)) {
                            absent7DayCount++;

                    return { ...emp, absentCount7Days: absent7DayCount };

            const handleDownloadCSV = () => {

                const rows = filtered.map(e => [

                    `"${e.name}"`, 
                    `"${e.line}"`, 
                    `"${e.group}"`, 
                    `"${e.role}"`, 
                    `"${e.status}"`

                const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + 
                    [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `haier_attendance_${rawDate}_${activeShift}_${selectedLine}.csv`);

                const mapping = {

                    'สาย': 'Late',
                    'ลาป่วย': 'Sick',
                    'ลากิจ': 'Personal',
                    'ลาพักร้อน': 'Vacation',
                    'ลาอื่นๆ': 'Other',
                    'ขาดงาน': 'Absent',

                return mapping[thaiStatus] || thaiStatus;

                const payload = itemsToSave.map(([id, data]) => {

                        action: 'UPDATE_ATTENDANCE', 
                        date: formatSheetDate(rawDate),

                        line: selectedLine,
                        id: id,

                        groupName: emp?.group || '',
                        status: mapStatusToEnglish(data.status) + suffix

                try {
                    const SCRIPT_URL = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : 'https://script.google.com/macros/s/AKfycbwQPcJlhR2plIgfDWnYrknQyPcuo2R4FAZEu4CuGtXdGVwDCWwUxgcXDJIMblFsdUxn/exec');
                    await fetch(SCRIPT_URL, {

                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(payload)

            const togglePresentCheck = (empId, currentStatus) => {

                setPresentSaveStatus(null);

                    const emp = employees.find(e => e.id === id);

                    return {
                        action: 'UPDATE_ATTENDANCE',
                        date: formatSheetDate(rawDate),
                        shift: activeShift,
                        line: selectedLine,
                        id: id,
                        name: emp?.name || '',
                        groupName: emp?.group || '',
                        status: mapStatusToEnglish(data.status) + suffix
                    };
                });

                try {
                    const SCRIPT_URL = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : 'https://script.google.com/macros/s/AKfycbwQPcJlhR2plIgfDWnYrknQyPcuo2R4FAZEu4CuGtXdGVwDCWwUxgcXDJIMblFsdUxn/exec');
                    await fetch(SCRIPT_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' },

                    setPresentSaveStatus({ type: 'success', msg: `บันทึกข้อมูลสำเร็จ (${payload.length} คน)` });
                    
                    setTimeout(() => {
                        setPresentSaveStatus(null);

                    }, 2000);
                } catch(e) {
                    setPresentSaveStatus({ type: 'error', msg: 'บันทึกไม่สำเร็จ โปรดลองอีกครั้ง' });
                } finally {
                    setIsSavingPresent(false);
                }

            if (isSyncing) {
                return (
                    <div className="bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-200 animate-pulse w-full print-hidden">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">

                                <div className="h-10 w-48 bg-slate-100 rounded-full"></div>

                                </p>

                    <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 mb-6">

                                    <h2 className="text-2xl sm:text-3xl font-black italic text-slate-800 flex items-center gap-2"> {tr("WOR MAP /")} <span className="text-slate-500 font-bold">{tr("平面图")}</span>

                                <input

                                <p className="text-xs font-bold text-slate-500 mt-1">{tr("ข้อมูล:")} {tr(selectedLine)} {tr("| กะการทำงาน:")} {tr(activeShift)}</p>

                        <div id="dashboard-action-buttons" className="grid grid-cols-2 md:flex md:flex-wrap items-center gap-2.5 w-full xl:w-auto justify-start xl:justify-end print-hidden shrink-0 transition-opacity duration-200">

                                    <div className="text-sm font-bold text-slate-600"> {tr("เลือกเพื่ออัปเดต")} <span className="text-amber-600 font-black bg-white px-2 py-0.5 rounded border border-amber-100 shadow-sm mx-1">{Object.values(absentUpdates).filter(u => u.checked).length}</span> {tr("รายการ")} </div>
                                    <div className="flex flex-col sm:flex-row gap-3 items-center w-full sm:w-auto">
                                        {absentSaveStatus && (

                                        >

                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showPresentModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-200 border border-slate-100">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-xl font-black text-slate-800 flex items-center gap-3">

                                        <i className="fa-solid fa-xmark text-lg"></i>

                                <div className="p-6 overflow-y-auto custom-scrollbar flex-1 bg-white">
                                    <div className="flex flex-wrap gap-3 mb-6">
                                        <div className="bg-slate-800 text-white px-4 py-2.5 rounded-xl shadow-sm text-sm font-black flex items-center gap-2"> {tr("รวมทั้งหมด")} <span className="bg-white/20 px-2.5 py-0.5 rounded-md">{presentEmployees.length}</span>
                                        </div>
                                        {Object.entries(presenceSummary).map(([status, count]) => {
                                            const config = STATUS_LEGEND.find(l => status.includes(l.label)) || { bg: 'bg-slate-200', color: 'text-slate-500' };
                                            return (

                                                    {tr(status)} <span className={`px-2.5 py-0.5 rounded-md text-white font-black ${config.bg}`}>{count}</span>
